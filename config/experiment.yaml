# PRE-REGISTERED EXPERIMENT DESIGN
# Written before any evaluation on clean test data. Do not edit after freeze
# except by regenerating the freeze and recording a declared rerun.

experiment_id: portfolio-debate-v1
preregistered_on: "2026-10-28"
scope: >
  Research and learning only. Historical data and paper trading only. This
  system never connects to a brokerage and nothing it produces is investment
  advice.

research_question: >
  After costs, and after controlling for look-ahead leakage, memorization and
  luck, does a multi-agent LLM debate add risk-adjusted value over simple
  baselines?

hypothesis:
  h0: "The debate system does not beat simple baselines on risk-adjusted performance."
  h1: "The debate system beats equal-weight AND the best simple signal after costs."
  outcome_that_counts_as_success: >
    Either a well-measured positive result satisfying all pass criteria, or a
    well-measured failure to detect value. A flattering result caused by
    leakage or overfitting is a failure.

universe_file: config/universe.yaml
market: US
decision_frequency: weekly
decision_day: Friday_close
fill_timing: next_trading_day_open
initial_capital: 100000

# Periods are generated by core/periods.py from config/models.yaml and frozen.
periods_file: config/periods.yaml
primary_test_period: clean_test
development_period: dev
contaminated_periods: [stress_holdout, dev, precutoff_holdout]
embargo_in_claims: excluded
forward_period: paper trading only

baselines: [equal_weight_buy_hold, equal_weight_rebalanced, momentum, low_vol,
            random_agent, single_llm, ensemble]
primary_strategy: debate
ablations: [debate_no_risk_manager, debate_one_analyst, debate_no_debate,
            random_agent_through_risk_layer]

metrics: [annualized_return, annualized_volatility, sharpe, sortino,
          max_drawdown, turnover, cost_drag, hit_rate, conviction_calibration]

comparisons:
  - {strategy: debate, baseline: equal_weight_buy_hold, metric: sharpe, direction: greater_than, ci_must_exclude_zero: true}
  - {strategy: debate, baseline: best_simple_signal, metric: sharpe, direction: greater_than, ci_must_exclude_zero: true}
  - {strategy: debate, baseline: random_agent_null, metric: sharpe, direction: percentile_at_least, threshold: 95}
  - {strategy: debate, baseline: single_llm, metric: sharpe, direction: greater_than}
  - {strategy: debate, baseline: ensemble, metric: sharpe, direction: greater_than}

leakage_defences:
  clean_window: true
  anonymization_default: true
  memorization_probe: true
  contamination_gap_test: true
  transcript_leakage_scan: true
  prompted_ignorance_relied_upon: false
  news_in_primary_config: false

contamination_thresholds:
  # Fixed before seeing results.
  max_abs_contamination_gap_sharpe: 0.50
  max_clean_probe_identification_rate: 0.15   # chance = 1/20 = 0.05
  max_unexplained_clean_transcript_flags: 0

pass_fail:
  # Pre-registered section-9 criteria. ALL must hold for "evidence of value".
  criteria:
    1: >
      Debate Sharpe beats equal-weight buy-and-hold AND the best simple signal,
      with a paired block-bootstrap 95% CI for the difference excluding zero.
    2: >
      Debate Sharpe ranks at or above the 95th percentile of the random-agent
      null distribution.
    3: >
      The result survives 2x costs and the rebalance-day offset (Wednesday).
    4: >
      Pre-cutoff contamination gap is below the threshold, the memorization
      probe is near chance on clean-period contexts, and clean-period transcript
      flags are zero or explained.
    5: >
      Deflated Sharpe, adjusted for every ledger trial, remains positive.
  otherwise: >
    Report "no reliable evidence of value", describe what was tried, and explain
    likely reasons (power, leakage, costs).

robustness_checks:
  - {name: costs_2x, cost_multiplier: 2.0}
  - {name: rebalance_wednesday, rebalance_weekday: 2}
  - {name: random_half_universe, universe_fraction: 0.5}
  - {name: biweekly_frequency, decision_frequency: biweekly}

power:
  # Required before final run. Minimum clean window is 52 weekly decisions.
  min_clean_weeks: 52
  alpha: 0.05
  power: 0.80
  note: >
    With roughly 90 weekly decisions any true Sharpe improvement below the
    simulated minimum detectable effect cannot be distinguished from luck.

null_distribution:
  runs: 1000
  seed: 20261028
  note: "Random proposals go through the SAME risk layer, simulator and costs."

multiple_testing:
  ledger: ledger.jsonl
  deflated_sharpe: true
  trial_count_reported: true

llm_budget:
  max_calls_per_run: 1200
  note: "Approximate: decisions x calls_per_decision. Confirm against API budget."

privacy_and_data:
  builder_reads: data/dev only
  sealed_data: data/sealed, supplied by human at final evaluation
  builder_may_run_clean_test: false
  no_brokerage_connection: true

freeze:
  lock_file: freeze.lock
  hash_algorithm: sha256
  hashed:
    - config/prompts
    - config/risk_limits.yaml
    - config/costs.yaml
    - config/tunables.yaml
    - config/tuning_grid.yaml
    - config/experiment.yaml
    - config/periods.yaml
    - config/models.yaml
    - config/universe.yaml
    - core
    - agents
    - baselines
    - eval
  require_verified_model_cutoff_for_final: true
